name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools
 
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build_output.log

      - name: Show error summary
        if: failure()
        run: grep -a -E "\[ERROR\]|error:|FAILED|Traceback" build_output.log | head -n 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-bot-apk
          path: bin/*.apk
