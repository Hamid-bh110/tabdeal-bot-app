name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Show error summary
        if: always()
        run: |
          echo "=== آخرین ۱۵۰ خط لاگ ==="
          tail -n 150 build_output.log

      - name: Check APK exists
        run: |
          ls bin/*.apk 
          / || (echo "APK ساخته نشد - build واقعاً شکست خورده" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tabdeal-bot-apk
          path: bin/*.apk
